name: workspace-release
on:
  push:
    branches: [main]
    paths:
      - 'codex/**'
      - 'scripts/**'
      - 'tests/**'
      - 'workspaces/**'
      - '.github/workflows/workspace-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: workspace-saidc-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install test dependencies
        run: python3 -m pip install -r tests/requirements.txt
      - name: Test package and hooks
        run: python3 -m unittest discover -s tests -v
      - name: Prepare release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git init "$RUNNER_TEMP/acahti-workspace-release"
          cd "$RUNNER_TEMP/acahti-workspace-release"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if test -n "$(git ls-remote --heads origin workspace-saidc)"; then
            git fetch --depth=1 origin workspace-saidc
            git checkout -B workspace-saidc FETCH_HEAD
          else
            git checkout --orphan workspace-saidc
          fi
      - name: Generate marketplace
        run: python3 scripts/export_marketplace.py --output "$RUNNER_TEMP/acahti-workspace-release" --commit "$GITHUB_SHA"
      - name: Publish generated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/acahti-workspace-release"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish SAIDC workspace plugin from ${GITHUB_SHA}"
          git push origin HEAD:workspace-saidc
